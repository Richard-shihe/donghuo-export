name: "数据汇总 Update_Data（9 合 1 · 全 JSON 接口）"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即触发"

# 并发控制：与 Update_Data_legacy.yml 共用同一个组名，
# 保证新旧脚本绝不同时全量替换同一批飞书表（全量替换是先删后建，撞车会互相清空）。
concurrency:
  group: update-data-sync
  cancel-in-progress: false

jobs:
  sync-all:
    name: 懂火登录 → 9 模块接口取数 → 飞书写入 → 汇总通知
    runs-on: ubuntu-latest
    # 本地实测 2026-10-03：8 模块取数 ≈238s + 8 张表写入 ≈500s；⑨ 库存 1101 行再 +15s
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 不再安装 Playwright：全 JSON 接口取数，零浏览器
      # （登录验证码仍走 ddddocr，已含在 requirements.txt 里）

      # 幂等建表：⑦采购订单 / ⑧采购明细 / ⑨库存 三张自动引导表，
      # 存在就跳过（只列一次表），缺了就按注册表里的字段表建。
      # 放在同步之前，避免同步跑到那一步才因为「表不存在」整块失败。
      - name: 幂等引导新表（⑦⑧⑨）
        # 尽力而为：这一步失败不该拖垮整个 run —— 同步脚本对每个模块是独立 try，
        # 表真有问题时只有 ⑦⑧⑨ 三块报错，①②③④⑤⑥ 照常同步。
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python 数据汇总/Update_Data.py --ensure-tables

      - name: 运行 Update_Data 九合一同步
        env:
          # ===== 懂火系统账号（仓库 Secrets） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 飞书自建应用（仓库 Secrets） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # 时区：① 出库筛选的 end_time 取「今天」，UTC runner 不设会差一天
          TZ: "Asia/Shanghai"
        run: python 数据汇总/Update_Data.py

      # 失败时把已拉到的原始数据留成证据（runner 结束后就没了）
      - name: 失败时保留 CSV 证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csv_backup
          path: 数据汇总/csv_backup/
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 懂火 9 合 1 同步失败，请检查 Secrets（DH_USERNAME/DH_PASSWORD/FEISHU_APP_ID/FEISHU_APP_SECRET）或懂火网站状态"
