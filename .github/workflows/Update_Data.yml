name: "数据汇总 Update_Data（11 合 1 · 全 JSON 接口）"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即触发"

# 并发控制：与 Update_Data_legacy.yml 共用同一个组名，
# 保证新旧脚本绝不同时全量替换同一批飞书表（全量替换是先删后建，撞车会互相清空）。
concurrency:
  group: update-data-sync
  cancel-in-progress: false

jobs:
  sync-all:
    name: 懂火登录 → 11 模块接口取数 → 飞书写入 → 汇总通知
    runs-on: ubuntu-latest
    # 2026-10-03 改造后：表级并发写 + 取写流水线。新版实测 334s / 473s / 542s
    #（最慢 run 37207784395，约 9 分钟）。
    #
    # ⚠️ 改这个值之前先看历史，别按直觉调：
    #   09-06 建时 20 → 10-03 16:09 改 30 → 10-03 22:34 改回 20 → 10-05 改回 30
    # 20 分钟的代价有实测：09-15~09-30 期间旧串行版正常跑 807~1100s（13.5~18.3 分），
    # 那半个月的 15 次每日定时里有 7 次撞上 20 分钟天花板被 GitHub 直接 cancelled
    #（卡点全落在 1208~1223s，一秒不多），那 7 天数据一次都没同步成功。
    # 旧版波动 1.36 倍，懂火取数侧实测波动到 2.85 倍 —— 20 分钟的余量兜不住。
    # 30 分钟只在真挂死时多烧 10 分钟，换来的是不再静默丢一整天数据。
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'                          # 缓存 wheel，第二次起省 20-40s
          cache-dependency-path: requirements.txt

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      # 不再安装 Playwright：全 JSON 接口取数，零浏览器
      # （登录验证码仍走 ddddocr，已含在 requirements.txt 里）

      # 幂等建表：⑦采购订单 / ⑧采购明细 / ⑨库存 三张自动引导表，
      # 存在就跳过（只列一次表），缺了就按注册表里的字段表建。
      # 放在同步之前，避免同步跑到那一步才因为「表不存在」整块失败。
      - name: 幂等引导新表（⑦⑧⑨）
        # 尽力而为：这一步失败不该拖垮整个 run —— 同步脚本对每个模块是独立 try，
        # 表真有问题时只有 ⑦⑧⑨ 三块报错，①②③④⑤⑥ 照常同步。
        continue-on-error: true
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: python 数据汇总/Update_Data.py --ensure-tables

      - name: 运行 Update_Data 十一合一同步
        env:
          # ===== 懂火系统账号（仓库 Secrets） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 飞书自建应用（仓库 Secrets） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # 时区：① 出库筛选的 end_time 取「今天」，UTC runner 不设会差一天
          TZ: "Asia/Shanghai"
        # --workers 6：表级并发写（表内仍严格串行）。回滚用 --workers 1 --no-pipeline
        run: python 数据汇总/Update_Data.py --workers 6

      # 失败时把已拉到的原始数据留成证据（runner 结束后就没了）
      - name: 失败时保留 CSV 证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: csv_backup
          path: 数据汇总/csv_backup/
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 懂火 11 合 1 同步失败，请检查 Secrets（DH_USERNAME/DH_PASSWORD/FEISHU_APP_ID/FEISHU_APP_SECRET）或懂火网站状态"
