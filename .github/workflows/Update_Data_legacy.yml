name: "[回滚备用] 数据汇总 Update_Data legacy（6 合 1 · 浏览器导出）"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即触发"

# 并发控制：与新版 Update_Data.yml 共用同一个组名，
# 保证新旧脚本绝不同时全量替换同一批飞书表（legacy 跑一次就够，不需要和新版并行）。
concurrency:
  group: update-data-sync
  cancel-in-progress: false

jobs:
  sync-all:
    name: 登录懂火 → 6 模块合并导出 → 飞书写入 → 汇总通知
    runs-on: ubuntu-latest
    # 5 合 1 实测 804s；⑥ 多一次 UI 导出（2489 行）+ 一次写入，留足余量
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 Playwright Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: 运行 Update_Data 六合一同步
        env:
          # ===== 懂火系统账号（仓库 Secrets） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 飞书自建应用（仓库 Secrets） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # 时区
          TZ: "Asia/Shanghai"
        run: |
          python 数据汇总/Update_Data_legacy.py --ci
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 懂火 6 合 1 同步失败，请检查 Secrets（DH_USERNAME/DH_PASSWORD/FEISHU_APP_ID/FEISHU_APP_SECRET）或懂火网站状态"
