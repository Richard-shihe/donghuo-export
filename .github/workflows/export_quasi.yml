name: 准发下载 → 上传飞书云盘 → 写入进度表

# 触发方式：
# 可在 Actions 页面手动点击 "Run workflow" 立即触发
# 步骤顺序：①准发→下载→导出 xlsx  ②上传飞书云盘  ③用同一份 xlsx 更新"进度"表（准发量/出厂量）
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即准发下载 + 更新进度表"
      dry_run:
        description: "写入进度表时仅预览匹配（true） 还是 实际写入（false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: quasi-hair-export
  cancel-in-progress: false

jobs:
  export-upload-update:
    name: ①准发下载 ②上传云盘 ③写入进度表
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ①② 运行准发下载脚本 → 自动上传飞书云盘（同一份 xlsx 留给下一步写入）
        env:
          # ===== 宝钢 IEC 系统账号（在仓库 Secrets 中配置） =====
          IBAO_USERNAME: ${{ secrets.IBAO_USERNAME }}
          IBAO_PASSWORD: ${{ secrets.IBAO_PASSWORD }}

          # ===== 飞书云盘（默认文件夹 QIvpfoJnqlg8IIdT1PXctnB3nne 已在脚本硬编码） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # 如需上传到其它文件夹，在这里覆盖；留空则用默认
          FEISHU_FOLDER_TOKEN: ${{ vars.QUASI_FOLDER_TOKEN || '' }}

          # 时区（确保文件名时间、日期范围正确）
          TZ: "Asia/Shanghai"
        run: |
          set -e
          # 检查必填 Secrets
          if [ -z "$IBAO_USERNAME" ] || [ -z "$IBAO_PASSWORD" ]; then
            echo "::error:: 缺少 IBAO_USERNAME / IBAO_PASSWORD Secrets，请在仓库 Settings → Secrets 中配置"
            exit 1
          fi
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo "::error:: 缺少 FEISHU_APP_ID / FEISHU_APP_SECRET Secrets"
            exit 1
          fi
          echo "=== Secrets 检查通过 ==="
          echo "IBAO_USERNAME: ${IBAO_USERNAME:0:3}***"
          echo "FEISHU_APP_ID: ${FEISHU_APP_ID:0:7}***"

          # 运行下载脚本
          python download_bundle.py

          # 确认 xlsx 已生成
          echo "=== 检查生成的 xlsx 文件 ==="
          ls -la 准发下载_*.xlsx || {
            echo "::error:: download_bundle.py 执行完成但未生成 xlsx 文件，请检查上面的日志"
            exit 1
          }

      - name: ③ 用刚下载的同一份 xlsx → 更新飞书"进度"表（准发量 / 出厂量）
        env:
          # ===== 飞书自建应用（在仓库 Secrets 中配置） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== 多维表格（默认 app_token Tz0XbQVzkaZuJasBwb8cRjkfnoe 已在脚本硬编码） =====
          BITABLE_APP_TOKEN: ${{ vars.PROGRESS_BITABLE_TOKEN || '' }}

          TZ: "Asia/Shanghai"
          DRY_RUN_FLAG: ${{ inputs.dry_run }}
        run: |
          set -e
          # 确认 xlsx 存在（虽然 step 1 已检查，这里再保险一次）
          ls 准发下载_*.xlsx || {
            echo "::error:: 上一步未生成 xlsx 文件，无法更新进度表"
            exit 1
          }
          if [ "$DRY_RUN_FLAG" = "true" ]; then
            python update_progress_delivery.py --dry-run
          else
            python update_progress_delivery.py
          fi

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 流程失败：请检查 Secrets/IEC 登录状态/飞书多维表字段权限（准发量/出厂量可写）"
