name: 准发下载 → 上传飞书云盘

# 触发方式：
# 可在 Actions 页面手动点击 "Run workflow" 立即触发
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即准发下载"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: quasi-hair-export
  cancel-in-progress: false

jobs:
  export-and-upload:
    name: 从宝钢 IEC 准发菜单"下载" → xlsx → 上传飞书云盘
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行准发下载脚本 → 自动上传飞书云盘
        env:
          # ===== 宝钢 IEC 系统账号（在仓库 Secrets 中配置） =====
          IBAO_USERNAME: ${{ secrets.IBAO_USERNAME }}
          IBAO_PASSWORD: ${{ secrets.IBAO_PASSWORD }}

          # ===== 飞书云盘（默认文件夹 QIvpfoJnqlg8IIdT1PXctnB3nne 已在脚本硬编码） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # 如需上传到其它文件夹，在这里覆盖；留空则用默认
          FEISHU_FOLDER_TOKEN: ${{ vars.QUASI_FOLDER_TOKEN || '' }}

          # 时区（确保文件名时间、日期范围正确）
          TZ: "Asia/Shanghai"
        run: |
          python download_bundle.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 准发下载失败，请检查 Secrets 配置或 IEC 网站状态 / 验证码识别重试次数"
