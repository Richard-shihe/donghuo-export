name: 准发——下载 → 云盘 → 进度
# （保留旧名兼容 cron-job.org / 旧触发器）
# 实际职责：IEC 货物管理 → 出厂码单 → 码单捆包下载 → 上传飞书云盘
#           文件夹：DfQdfSxl2ld25wdx6Rxcub9hnDf
#           文件名：码单_YYMMDD_HHMMSS.xlsx
# 文档见：export_iec_bundle.py 顶部 docstring

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即：IEC 出厂码单 → 码单捆包下载 → 飞书云盘 DfQdfSxl2"
      days:
        description: "出厂日期近 N 天（含今日，默认 30）。被 date_start/end 覆盖。"
        required: false
        default: "30"
      date_start:
        description: "出厂日期起 YYYYMMDD（留空用 --days 算）"
        required: false
        default: ""
      date_end:
        description: "出厂日期止 YYYYMMDD（留空=今天）"
        required: false
        default: ""
      dry_run:
        description: "只下载不上传（true） 还是 下载+上传飞书（false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 并发控制：同一时刻只跑一个实例，避免 IEC 同时触发多次 exportExcel 排队
concurrency:
  group: quasi-hair-export
  cancel-in-progress: false

jobs:
  export-upload:
    name: ①IEC 出厂码单·码单捆包下载 ②上传飞书云盘 DfQdfSxl2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ①② 出厂码单·码单捆包下载 → 自动上传飞书云盘
        env:
          # ===== 宝钢 IEC 系统账号（仓库 Secrets 中配置） =====
          IBAO_USERNAME: ${{ secrets.IBAO_USERNAME }}
          IBAO_PASSWORD: ${{ secrets.IBAO_PASSWORD }}

          # ===== 飞书自建应用（仓库 Secrets 中配置，需 drive:drive 权限 + 文件夹可编辑协作者） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # 飞书私信通知专用应用（可选；留空则用默认 FEISHU_APP_SECRET 回退）
          FEISHU_NOTIFY_APP_SECRET: ${{ secrets.FEISHU_NOTIFY_APP_SECRET }}

          # ===== 飞书云盘目标文件夹（用户指定 URL 中提取：DfQdfSxl2ld25wdx6Rxcub9hnDf）=====
          #   可在 vars 里覆盖 QUASI_FOLDER_TOKEN，或直接改下方默认值
          FEISHU_FOLDER_TOKEN: ${{ vars.QUASI_FOLDER_TOKEN || 'DfQdfSxl2ld25wdx6Rxcub9hnDf' }}

          # 飞书私信通知：Union ID 列表（逗号分隔），不传则脚本内置默认 2 人
          FEISHU_UNION_IDS: ${{ secrets.FEISHU_UNION_IDS || '' }}

          # 时区（确保文件名时间、日期范围正确）
          TZ: "Asia/Shanghai"

          DRY_RUN_FLAG: ${{ inputs.dry_run }}
          DAYS_FLAG: ${{ inputs.days }}
          DATE_START_FLAG: ${{ inputs.date_start }}
          DATE_END_FLAG: ${{ inputs.date_end }}
          REASON_FLAG: ${{ inputs.reason }}
        run: |
          set -e
          # 1. 必填 Secrets 检查
          if [ -z "$IBAO_USERNAME" ] || [ -z "$IBAO_PASSWORD" ]; then
            echo "::error:: 缺少 IBAO_USERNAME / IBAO_PASSWORD Secrets，请在仓库 Settings → Secrets 中配置"
            exit 1
          fi
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo "::error:: 缺少 FEISHU_APP_ID / FEISHU_APP_SECRET Secrets"
            exit 1
          fi
          echo "=== Secrets 检查通过 ==="
          echo "IBAO_USERNAME : ${IBAO_USERNAME:0:3}***"
          echo "FEISHU_APP_ID : ${FEISHU_APP_ID:0:7}***"
          echo "FEISHU_FOLDER : ${FEISHU_FOLDER_TOKEN}"
          [ -n "$REASON_FLAG" ] && echo "触发说明: ${REASON_FLAG}"

          # 2. 组装命令行参数
          CMD="python export_iec_bundle.py"
          if [ "$DRY_RUN_FLAG" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "$DATE_START_FLAG" ]; then
            CMD="$CMD --date-start $DATE_START_FLAG"
          fi
          if [ -n "$DATE_END_FLAG" ]; then
            CMD="$CMD --date-end $DATE_END_FLAG"
          fi
          if [ -z "$DATE_START_FLAG" ] && [ -z "$DATE_END_FLAG" ] && [ -n "$DAYS_FLAG" ]; then
            CMD="$CMD --days $DAYS_FLAG"
          fi
          # 飞书私信（Union ID 列表注入环境变量）
          if [ -n "$FEISHU_UNION_IDS" ]; then
            export NOTIFY_USERS="$FEISHU_UNION_IDS"
            echo "NOTIFY_USERS: (共 $(echo "$FEISHU_UNION_IDS" | awk -F',' '{print NF}') 个 Union ID)"
          fi

          echo ""
          echo "=== 运行命令 ==="
          echo "$CMD"
          echo ""
          $CMD

          # 3. 确认文件已生成
          echo ""
          echo "=== 检查生成的 码单_*.xlsx 文件 ==="
          ls -la 码单_*.xlsx || {
            echo "::error:: 脚本执行完成但未生成 码单_YYMMDD_HHMMSS.xlsx 文件，请检查上方日志"
            exit 1
          }

      - name: 失败时告警（供 cron-job.org 外部查看 Actions 结果）
        if: failure()
        run: |
          echo "::warning:: 流程失败，请检查：Secrets 是否齐全 / IEC 账号密码是否仍可用 / "
          echo "::warning::   飞书自建应用 cli_aaf0ce1e9ef89d27 是否已在文件夹 DfQdfSxl2ld25wdx6Rxcub9hnDf 中添加为「可编辑」协作者"
          echo "::warning::   私信 Union ID 列表是否正确（FEISHU_UNION_IDS 以逗号分隔，无需空格）"
