name: IEC 出厂码单 - 捆包采样 → 云盘

# 触发方式：
# 可在 Actions 页面手动点击 "Run workflow" 立即触发
# 步骤：①准发→捆包下载→导出 xlsx  ②上传飞书云盘指定文件夹
# 用途：从 IEC 拉捆包级（bundle）准发数据，上传到飞书云盘供业务验证字段
#       （为后续设计 import_lindiao.py 写入懂火临调库存提供字段依据）
# 注：与 export_IEC_zhunfa.yml 的差异：
#   - 用 --type bundle（捆包级明细，而非订单级）
#   - 上传到文件夹 ED95fwg5MlAZlAdsmRQcfJ3vn7d（用户指定，非默认文件夹）
#   - 不跑 update_progress_delivery.py（仅做字段采样验证）

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "采样 bundle 字段上传飞书云盘验证"
      start_month:
        description: "起始月份 YYYYMM（留空用脚本默认：当前月前 3 月）"
        required: false
        default: ""
      end_month:
        description: "结束月份 YYYYMM（留空用脚本默认：当前月后 1 月）"
        required: false
        default: ""

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: iec-bundle-sample
  cancel-in-progress: false

jobs:
  bundle-sample-upload:
    name: ①IEC 捆包下载 ②上传飞书云盘
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ①② 运行捆包下载脚本 → 自动上传飞书云盘
        env:
          # ===== 宝钢 IEC 系统账号（在仓库 Secrets 中配置，与 export_IEC_zhunfa.yml 复用） =====
          IBAO_USERNAME: ${{ secrets.IBAO_USERNAME }}
          IBAO_PASSWORD: ${{ secrets.IBAO_PASSWORD }}

          # ===== 飞书云盘（与 export_IEC_zhunfa.yml 复用） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # 时区（确保文件名时间、日期范围正确）
          TZ: "Asia/Shanghai"
        run: |
          set -e

          # 检查必填 Secrets
          if [ -z "$IBAO_USERNAME" ] || [ -z "$IBAO_PASSWORD" ]; then
            echo "::error:: 缺少 IBAO_USERNAME / IBAO_PASSWORD Secrets，请在仓库 Settings → Secrets 中配置"
            exit 1
          fi
          if [ -z "$FEISHU_APP_ID" ] || [ -z "$FEISHU_APP_SECRET" ]; then
            echo "::error:: 缺少 FEISHU_APP_ID / FEISHU_APP_SECRET Secrets"
            exit 1
          fi
          echo "=== Secrets 检查通过 ==="
          echo "IBAO_USERNAME: ${IBAO_USERNAME:0:3}***"
          echo "FEISHU_APP_ID: ${FEISHU_APP_ID:0:7}***"
          echo ""

          # 从 inputs 读月份范围（留空则脚本用 _default_range()，即当前月前 3 月到后 1 月）
          START_MONTH="${{ inputs.start_month }}"
          END_MONTH="${{ inputs.end_month }}"

          # 构造命令参数
          # --type bundle: 捆包级明细（含捆包号/件重/仓库等字段）
          # --folder-token: 上传到用户指定的飞书文件夹（不覆盖默认 QUASI_FOLDER_TOKEN）
          ARGS="--type bundle --folder-token ED95fwg5MlAZlAdsmRQcfJ3vn7d"
          if [ -n "$START_MONTH" ]; then
            ARGS="$ARGS --start $START_MONTH"
          fi
          if [ -n "$END_MONTH" ]; then
            ARGS="$ARGS --end $END_MONTH"
          fi

          echo "=== 运行命令 ==="
          echo "python download_bundle.py $ARGS"
          echo ""
          python download_bundle.py $ARGS

          # 确认 xlsx 已生成
          echo ""
          echo "=== 检查生成的 xlsx 文件 ==="
          ls -la 准发下载_*.xlsx || {
            echo "::error:: download_bundle.py 执行完成但未生成 xlsx 文件，请检查上面的日志"
            exit 1
          }

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 流程失败：请检查 Secrets / IEC 登录状态 / 飞书云盘文件夹 ED95fwg5MlAZlAdsmRQcfJ3vn7d 是否已把应用 cli_aaf0ce1e9ef89d27 加为可编辑协作者"
