name: 欧冶模板Excel导出

# 触发方式：可在 Actions 页面手动点击 "Run workflow" 触发
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "导出 tblDFiiwWkJ5tZp3 挂-士禾/挂-砚启 两视图 → 欧冶模板 Excel → 飞书 IM 私聊发送"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: export-ouyeel-exel
  cancel-in-progress: false

jobs:
  export-and-send:
    name: 导出欧冶模板 Excel → 飞书 IM 发送
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 飞书应用凭证（FEISHU_APP_ID/FEISHU_APP_SECRET）复用仓库已有的 Secrets
      # 收件人默认在脚本中硬编码；如需临时更换，可在 Secrets/Variables 配 FEISHU_UNION_ID_OUYEE（逗号分隔）
      - name: 运行欧冶模板导出脚本 → 生成 Excel → 飞书 IM 发送
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_UNION_ID_OUYEE: ${{ secrets.FEISHU_UNION_ID_OUYEE || vars.FEISHU_UNION_ID_OUYEE || '' }}
          TZ: "Asia/Shanghai"
        run: |
          python export_ouyeel_exel.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 欧冶模板 Excel 导出/发送失败，请检查飞书应用凭证或权限配置"
