name: 自动导出开票申请单(待确认)并写入飞书多维表格

# 触发方式：
# 1) 工作日（周一到周五）北京时间 09:00-18:30 每半小时执行一次
#    UTC 1:00-10:30 每半小时：*/30 1-10 * * 1-5
# 2) 节假日（周六、周日）每4小时执行一次
#    UTC 0,4,8,12,16,20 点：0 0-23/4 * * 6,0
# 3) 可在 Actions 页面手动点击 "Run workflow" 立即触发
on:
  schedule:
    # 工作日 9:00-18:30 每半小时（北京时间 = UTC+8）
    - cron: "*/30 1-10 * * 1-5"
    # 节假日（周六周日）每4小时
    - cron: "0 0-23/4 * * 6,0"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即导出开票申请单"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: export-kaipiao
  cancel-in-progress: false

jobs:
  export-and-upload:
    name: 导出开票申请单(待确认) → 写入飞书多维表格 → 打铃通知
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行开票申请单导出脚本 → 写入飞书多维表格 → 打铃通知
        env:
          # ===== 交付方式：bitable（写入飞书多维表格）=====
          DELIVERY_MODE: bitable

          # ===== 懂火系统账号（在仓库 Secrets 中配置） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 飞书自建应用 =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== 飞书多维表格 =====
          # 多维表格 app_token（URL 中 /base/ 后面的那段）
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
          # 默认表ID=滚动表，视图=放入视图（可在此覆盖）
          BITABLE_TABLE_ID: ${{ vars.KP_BITABLE_TABLE_ID || 'tblfqRNfFg3NUcTo' }}
          # 去重开关：1=按申请单号去重（默认），0=允许重复追加
          BITABLE_DEDUP: ${{ vars.KP_BITABLE_DEDUP || '1' }}

          # ===== 可选筛选（默认状态=待确认）=====
          FILTER_ZHUANTAI: ${{ vars.KP_FILTER_ZHUANTAI || '待确认' }}

          # 时区（确保文件名时间、日期正确）
          TZ: "Asia/Shanghai"
        run: |
          python feishu_uploader/export_kaipiao.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 开票申请单自动导出失败，请检查 Secrets 配置或目标网站状态"
