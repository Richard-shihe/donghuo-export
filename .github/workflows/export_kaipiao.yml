name: 自动导出开票申请单(待确认)并写入飞书多维表格

# 触发方式（北京时间 = UTC+8，所有日子 0:00-6:30 不更新）：
# 1) 工作日（周一到周五）09:00-18:30 每半小时执行一次
#    UTC 1:00-10:30 每半小时：*/30 1-10 * * 1-5
# 2) 工作日（周一到周五）9:00-18:30 之外（且非0:00-6:30），每2小时执行一次
#    北京时间 7:00, 8:00, 20:00, 22:00, 23:00 → UTC 23, 0, 12, 14, 15
# 3) 节假日（周六、周日）每4小时（且非0:00-6:30）
#    北京时间 8:00,12:00,16:00,20:00 → UTC 0,4,8,12
# 4) 可在 Actions 页面手动点击 "Run workflow" 立即触发
on:
  schedule:
    # 工作日 9:00-18:30 每半小时
    - cron: "*/30 1-10 * * 1-5"
    # 工作日 7:00/8:00/20:00/22:00/23:00（每2小时，排除0:00-6:30）
    - cron: "0 23,0,12,14,15 * * 1-5"
    # 节假日 8:00/12:00/16:00/20:00（每4小时，排除0:00-6:30）
    - cron: "0 0,4,8,12 * * 6,0"
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即导出开票申请单"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: export-kaipiao
  cancel-in-progress: false

jobs:
  export-and-upload:
    name: 导出开票申请单(待确认) → 写入飞书多维表格 → 打铃通知
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行开票申请单导出脚本 → 写入飞书多维表格 → 打铃通知
        env:
          # ===== 交付方式：bitable（写入飞书多维表格）=====
          DELIVERY_MODE: bitable

          # ===== 懂火系统账号（在仓库 Secrets 中配置） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 飞书自建应用 =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== 飞书多维表格 =====
          # 多维表格 app_token（URL 中 /base/ 后面的那段）
          # 其他参数（表ID/视图/去重等）在脚本内有默认值，通常无需覆盖
          BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}

          # 时区（确保文件名时间、日期正确）
          TZ: "Asia/Shanghai"
        run: |
          python feishu_uploader/export_kaipiao.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 开票申请单自动导出失败，请检查 Secrets 配置或目标网站状态"
