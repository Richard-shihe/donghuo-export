name: 临调——云盘——多维表格

# 触发方式：
# 可在 Actions 页面手动点击 "Run workflow" 立即触发
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即导出临调库存"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: export-lindiao
  cancel-in-progress: false

jobs:
  export-and-upload:
    name: 导出临调库存 → 上传云盘 + 写多维表格 → 通知
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行临调库存导出脚本 → 交付飞书 → 通知
        env:
          # ===== 交付方式 =====
          #   both    (默认)：同时上传云盘 + 写多维表格
          #   feishu        : 仅上传 CSV 到飞书云盘指定文件夹
          #   bitable       : 仅把数据追加写入飞书多维表格
          #   local         : 仅本地保存（CI 无意义，仅本地调试用）
          # 想切换模式时，在仓库 Variables 中加 LD_DELIVERY_MODE=<上面任一值>
          DELIVERY_MODE: ${{ vars.LD_DELIVERY_MODE || 'both' }}

          # ===== 懂火系统账号（在仓库 Secrets 中配置） =====
          # 注：DH1_xxx 是旧账号 HONG@shihe.donghuo，已在 GitHub Actions 上建立境外 IP 信任（8/13 验证可拿数据）
          #     DH_xxx 是新账号 R@shihe.donghuo，本地可用但 GitHub Actions 上被风控返回 0 条
          DH_USERNAME: ${{ secrets.DH1_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH1_PASSWORD }}

          # ===== 飞书自建应用凭证（在仓库 Secrets 中配置） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== feishu 模式专用：目标云盘文件夹 token =====
          # 临调库存（欧冶资源）文件夹 O8i6fsf5dlQtX3ds3D2cjGQtnVh
          FEISHU_FOLDER_TOKEN: ${{ secrets.LD_FOLDER_TOKEN }}

          # ===== bitable 模式专用：多维表格 app_token 与 目标 table_id =====
          # 注：飞书应用需对该多维表格有「可编辑」协作者权限
          BITABLE_APP_TOKEN: "IRCzb5XVganwbUsz9NKcaC0SnRA"
          BITABLE_TABLE_ID: "tblaHMNprLueWYDP"

          # ===== 通知机器人（私聊优先，群聊/Webhook 备选） =====
          # 收件人默认写死在脚本里（2 个人 + 2 个群，oc_ 开头自动按群聊发送）
          # 临时换收件人：在仓库 Variables 配 FEISHU_UNION_ID_OUYEE（英文逗号分隔，支持 on_/oc_ 混合）
          FEISHU_UNION_ID_OUYEE: ${{ vars.FEISHU_UNION_ID_OUYEE || secrets.FEISHU_UNION_ID_OUYEE || '' }}
          # 私聊：FEISHU_UNION_IDS（通用覆盖，逗号分隔）— 优先级低于上面的 OUYEE 专用变量
          #       需要应用已发布到对方所在部门 + im:message:send_as_bot 权限
          FEISHU_UNION_IDS: ${{ secrets.FEISHU_UNION_IDS }}
          # 群聊（备选）：应用已加入的群 chat_id（oc_xxx）
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
          # Webhook 兜底方案（与私聊/群聊二选一即可）
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

          # ===== 可选筛选（都为空表示导出全部） =====
          # 状态筛选：已锁 / 未锁
          FILTER_SXZHUANTAI: ${{ vars.LD_FILTER_SXZHUANTAI || '' }}
          # 货权筛选：拥有 / 待赎
          FILTER_HUOQUAN: ${{ vars.LD_FILTER_HUOQUAN || '' }}
          # 仓库筛选（精确匹配）
          FILTER_CANKU: ${{ vars.LD_FILTER_CANKU || '' }}
          # 品名筛选
          FILTER_PINMIN: ${{ vars.LD_FILTER_PINMIN || '' }}

          # 时区（确保文件名时间、日期正确）
          TZ: "Asia/Shanghai"
        run: |
          python feishu_uploader/export_lindiao.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 临调库存自动导出失败，请检查 Secrets/Variables 配置或目标网站状态"
