name: 飞书多维表 → 懂火采购订单入库

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "执行阶段：ruku=入库（路线B默认）；create=创建订单+明细+提交审核（路线A）；all=两阶段连跑"
        required: true
        type: choice
        default: ruku
        options:
          - ruku
          - create
          - all
      limit:
        description: "最多处理 N 个合同号/捆包（留空=全部）"
        required: false
        type: string
        default: ""
      dry_run:
        description: "预览模式（不实际写懂火、不回写飞书状态，调试用）"
        required: false
        type: boolean
        default: false

concurrency:
  group: import-to-donghuo
  cancel-in-progress: false

jobs:
  import-to-donghuo:
    name: 飞书 → 懂火采购订单入库
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 import_to_donghuo.py
        env:
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          BITABLE_APP_TOKEN: ${{ vars.BITABLE_APP_TOKEN || 'OSuobf2ZkaWtUAsXEE9c3aBTnwh' }}
          BITABLE_TABLE_ID: ${{ vars.BITABLE_TABLE_ID || 'tblrhqzHuTsAprU3' }}
          TZ: "Asia/Shanghai"
        run: |
          ARGS=""
          ARGS="$ARGS --phase ${{ inputs.phase }}"
          if [ "${{ fromJSON(inputs.dry_run) }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
            echo "⚠️  预览模式（不写懂火、不回写飞书状态）"
          else
            echo "✅ 实际执行模式（写入懂火 + 回写飞书状态）"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
            export IMPORT_LIMIT="${{ inputs.limit }}"
          fi
          echo "最终参数: $ARGS"
          python import_to_donghuo.py $ARGS
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE
