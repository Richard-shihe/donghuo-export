name: IEC 出厂码单 - 捆包下载 → 云盘

# 触发方式：
# 可在 Actions 页面手动点击 "Run workflow" 立即触发
# 步骤：IEC 货物管理 → 出厂码单 → 码单捆包下载 → 上传飞书云盘
#       文件夹：DfQdfSxl2ld25wdx6Rxcub9hnDf
#       文件名：码单_YYMMDD_HHMMSS.xlsx
# 文档见：export_iec_bundle.py 顶部 docstring
# 注：如使用 cron-job.org 外部触发，URL 指向本 yml 文件名 export_IEC_madan.yml

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即下载出厂码单"
      days:
        description: "出厂日期范围：近 N 天（含今日，默认 30）"
        required: false
        default: "30"
      date_start:
        description: "出厂日期起 YYYYMMDD（留空用 days 计算）"
        required: false
        default: ""
      date_end:
        description: "出厂日期止 YYYYMMDD（留空=今天）"
        required: false
        default: ""
      dry_run:
        description: "仅下载不上传飞书云盘（true） 还是 实际上传（false）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

# 并发控制：同一时刻只跑一个实例
concurrency:
  group: iec-madan-export
  cancel-in-progress: false

jobs:
  madan-download-upload:
    name: IEC 出厂码单 → 飞书云盘
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ① 下载出厂码单 → ② 上传飞书云盘
        env:
          # ===== 宝钢 IEC 系统账号（在仓库 Secrets 中配置） =====
          IBAO_USERNAME: ${{ secrets.IBAO_USERNAME }}
          IBAO_PASSWORD: ${{ secrets.IBAO_PASSWORD }}

          # ===== 飞书云盘（默认文件夹 DfQdfSxl2ld25wdx6Rxcub9hnDf 已在脚本硬编码） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          # 如需上传到其它文件夹，在这里覆盖；留空则用默认
          FEISHU_FOLDER_TOKEN: ${{ vars.MADAN_FOLDER_TOKEN || '' }}

          # ===== 飞书私信通知（默认推 洪/王阳 2 人，见 export_iec_bundle.py） =====
          FEISHU_UNION_IDS: ${{ secrets.FEISHU_UNION_IDS || '' }}
          FEISHU_NOTIFY_APP_SECRET: ${{ secrets.FEISHU_NOTIFY_APP_SECRET || '' }}

          # 时区（确保文件名时间、日期范围正确）
          TZ: "Asia/Shanghai"

          # workflow_dispatch 输入参数转环境变量
          DAYS_INPUT: ${{ inputs.days }}
          DATE_START_FLAG: ${{ inputs.date_start }}
          DATE_END_FLAG: ${{ inputs.date_end }}
          DRY_RUN_FLAG: ${{ inputs.dry_run }}
        run: |
          echo "触发说明: ${{ inputs.reason }}"
          echo "近 N 天: ${DAYS_INPUT}    日期范围: ${DATE_START_FLAG}~${DATE_END_FLAG}    dry_run: ${DRY_RUN_FLAG}"
          echo "IBAO_USERNAME : ${IBAO_USERNAME:0:3}***"
          echo "FEISHU_APP_ID : ${FEISHU_APP_ID:0:7}***"
          echo "FEISHU_FOLDER : ${FEISHU_FOLDER_TOKEN:-DfQdfSxl2ld25wdx6Rxcub9hnDf (默认)}"

          # 组装命令行参数
          CMD="python export_iec_bundle.py"
          if [ "$DRY_RUN_FLAG" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ -n "$DATE_START_FLAG" ]; then
            CMD="$CMD --date-start $DATE_START_FLAG"
          fi
          if [ -n "$DATE_END_FLAG" ]; then
            CMD="$CMD --date-end $DATE_END_FLAG"
          fi
          # days 仅在未显式传 date_start 时生效（脚本里 --date-start 优先级高于 --days）
          if [ -z "$DATE_START_FLAG" ] && [ -n "$DAYS_INPUT" ]; then
            CMD="$CMD --days $DAYS_INPUT"
          fi

          echo "执行命令: $CMD"
          $CMD
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 流程失败：请检查 Secrets/IEC 登录状态/飞书应用权限"
          echo "::warning::   - IBAO_USERNAME / IBAO_PASSWORD 是否仍可用"
          echo "::warning::   - FEISHU_APP_ID / FEISHU_APP_SECRET 是否正确"
          echo "::warning::   - 飞书自建应用 cli_aaf0ce1e9ef89d27 是否已在文件夹 DfQdfSxl2ld25wdx6Rxcub9hnDf 中添加为「可编辑」协作者"
          echo "::warning::   - 私信 Union ID 列表是否正确（FEISHU_UNION_IDS 以逗号分隔，无需空格）"
