name: 懂火每周全量备份 10 类业务数据 → 飞书云盘

# 触发方式：
# - 手动：Actions 页面点击 "Run workflow" 立即执行
# - 定时：外部 cron-job.org 每周一次 HTTP 触发 workflow_dispatch
#   （项目约定：不用 native on: schedule，避免 GitHub 静默延迟）
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "预览模式（仅生成 XLSX 不上传云盘，调试用）"
        required: false
        type: boolean
        default: false
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即触发每周全量备份"

# 并发控制：同一时刻只跑一个实例（10 类业务串行，避免并发互相挤掉）
concurrency:
  group: backup-all
  cancel-in-progress: false

jobs:
  backup-all:
    name: 登录 → 循环 10 类业务 → XLSX → 上传飞书云盘 → 汇总通知
    runs-on: ubuntu-latest
    # 10 类业务串行拉取（开票明细单表 4 万+ 行），留足时间
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 backup_all.py
        env:
          # ===== 必填：懂火系统账号（仓库 Secrets） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 必填：飞书自建应用（仓库 Secrets） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== 可选：飞书机器人通知（上传后发汇总通知） =====
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

          # ===== 可选运行参数 =====
          # 分页每页条数（默认 200；服务端上限约 300，超过会丢数据）
          BACKUP_PAGE_SIZE: ${{ vars.BACKUP_PAGE_SIZE || '200' }}

          # 时区（确保文件名时间正确）
          TZ: "Asia/Shanghai"

          # 注：10 个飞书云盘子文件夹的 folder_token 已直接写在
          #     backup_all.py 的 TASKS 配置里，不再通过 Secrets 注入。
        run: |
          if [ "${{ fromJSON(inputs.dry_run) }}" = "true" ]; then
            export BACKUP_DRY_RUN=1
            echo "DRY-RUN 模式：仅生成 XLSX 到本地，不上传云盘"
          else
            echo "实际执行模式：生成 XLSX + 上传飞书云盘 + 发汇总通知"
          fi
          python backup_all.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 懂火每周全量备份失败，请检查 Secrets 配置、10 个云盘子文件夹协作者权限（把飞书应用加为可编辑），或目标网站状态"
