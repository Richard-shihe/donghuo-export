name: 懂火每周全量备份 10 类业务数据 → 飞书云盘

# 触发方式：
# - 定时：每周三、周六 凌晨 3 点（北京时间）。GitHub cron 用 UTC，
#   北京 03:00 = UTC 前一日 19:00 → 周二(TUE=2)、周五(FRI=5) 的 19:00 UTC。
# - 手动：Actions 页面点击 "Run workflow" 立即执行
#
# 2026-10-11 变更说明：本仓库原约定是「不用 native on: schedule，改走外部
# cron-job.org 触发，避免 GitHub 静默延迟」。但查明外部那条任务从未真正配起来 ——
# 本 workflow 从 2026-08-17 建好到 10-11 只跑过 1 次（建好当天手动触发），
# 两个月的「每周备份」实际一次都没跑。对每周两次的备份而言，延迟几十分钟无关紧要，
# 而外部依赖（PAT 过期 / 任务没配）才是真正的单点故障，因此改用原生 schedule，
# 并保留手动入口。注：GitHub 对长期无活动的仓库会自动停用 schedule，
# 本仓库几乎每天有提交，暂无此风险。
on:
  schedule:
    - cron: "0 19 * * 2,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "预览模式（仅生成 XLSX 不上传云盘，调试用）"
        required: false
        type: boolean
        default: false
      only:
        description: "只跑指定业务（逗号分隔，如「应收结算,费用管理」；留空 = 全部 10 类）"
        required: false
        type: string
        default: ""
      keep_periods:
        description: "云盘保留最近多少期（默认 52 ≈ 半年；0 = 不清理）"
        required: false
        type: string
        default: "52"
      reason:
        description: "手动触发说明（可选）"
        required: false
        default: "手动立即触发每周全量备份"

# 并发控制：同一时刻只跑一个实例（10 类业务串行，避免并发互相挤掉）
concurrency:
  group: backup-all
  cancel-in-progress: false

jobs:
  backup-all:
    name: 登录 → 循环 10 类业务 → XLSX → 上传飞书云盘 → 汇总通知
    runs-on: ubuntu-latest
    # 10 类业务串行拉取（开票明细单表 4 万+ 行），留足时间
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 backup_all.py
        env:
          # ===== 必填：懂火系统账号（仓库 Secrets） =====
          DH_USERNAME: ${{ secrets.DH_USERNAME }}
          DH_PASSWORD: ${{ secrets.DH_PASSWORD }}

          # ===== 必填：飞书自建应用（仓库 Secrets） =====
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}

          # ===== 可选：飞书机器人通知（上传后发汇总通知） =====
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}

          # ===== 可选运行参数 =====
          # 分页每页条数。上限 300（2026-10-11 实测：limit>300 时服务端仍只返回 300 条，
          # 而分页总数按请求的 limit 计算，中间记录会被静默跳过）。
          # 默认取 300 —— 比 200 少翻约 1/3 的页，整轮省 6~8 分钟；越界脚本会直接退出。
          BACKUP_PAGE_SIZE: ${{ vars.BACKUP_PAGE_SIZE || '300' }}

          # 只跑指定业务（失败后单类重跑，免去重拉另外 9 类）；留空 = 全部
          BACKUP_ONLY: ${{ github.event.inputs.only || '' }}

          # 云盘保留最近多少期，更早的自动删除；0 = 不清理
          BACKUP_KEEP_PERIODS: ${{ github.event.inputs.keep_periods || '52' }}

          # 时区（确保文件名时间正确）
          TZ: "Asia/Shanghai"

          # 注：10 个飞书云盘子文件夹的 folder_token 已直接写在
          #     backup_all.py 的 TASKS 配置里，不再通过 Secrets 注入。
        run: |
          # 用 github.event.inputs（而不是 inputs 上下文）：schedule 触发时前者为 null
          # 可被 || 兜底，后者在非 workflow_dispatch 事件里取值不可靠。
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            export BACKUP_DRY_RUN=1
            echo "DRY-RUN 模式：仅生成 XLSX 到本地，不上传云盘"
          else
            echo "实际执行模式：生成 XLSX + 上传飞书云盘 + 发汇总通知"
          fi
          python 懂火每周全量备份/backup_all.py
          EXIT_CODE=$?
          echo "脚本退出码: $EXIT_CODE"
          exit $EXIT_CODE

      - name: 失败时告警
        if: failure()
        run: |
          echo "::warning:: 懂火每周全量备份失败，请检查 Secrets 配置、10 个云盘子文件夹协作者权限（把飞书应用加为可编辑），或目标网站状态"
